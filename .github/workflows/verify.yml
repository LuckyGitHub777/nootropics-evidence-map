name: Verify evidence map records and static JavaScript
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout source without token persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify released hashes
        run: sha256sum --check --strict MANIFEST.sha256
      - name: Check evidence references and JS syntax
        run: |
          node --test tests/data.test.mjs
          node --check web/app.js
          node --check web/explore.js
